name: Render Free-Tier Keep-Alive Ping

on:
  schedule:
    # Run every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Ping Server
        env:
          TARGET_URL: ${{ secrets.RENDER_APP_URL || secrets.BACKEND_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::warning ::Neither RENDER_APP_URL nor BACKEND_URL secret is defined in repository secrets. Please configure it to enable keep-alive pings."
            exit 0
          fi

          CLEAN_URL="${TARGET_URL%/}"
          HEALTH_URL="$CLEAN_URL/api/health"

          echo "Sending keep-alive ping to $HEALTH_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL")

          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Server is awake and responding!"
          else
            echo "Server returned unexpected status: $HTTP_STATUS"
          fi
