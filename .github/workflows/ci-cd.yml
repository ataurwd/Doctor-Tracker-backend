name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile & Build
        run: npm run build

  deploy-to-render:
    name: Trigger Render Deployment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via Render Webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Render Deploy Hook..."
            response=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
            http_code=$(echo "$response" | tail -n1)
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Deployment hook successfully triggered (HTTP $http_code)."
            else
              echo "Deploy hook returned HTTP $http_code: $response"
              exit 1
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping webhook trigger (Render auto-deploy on push may still handle it)."
          fi
